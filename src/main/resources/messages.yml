# CameraRail 游戏内消息（MiniMessage）
# 支持 <white>、<gray>、<gradient:...> 等 Adventure 标签。
prefix: "<dark_gray>[<gray>镜头<dark_gray>]<reset> "

command:
  player-only: "<gray>此操作需要由玩家执行."
  no-permission: "<gray>你没有权限使用这个功能."
  usage: "<gray>用法: <white>{usage}</white>."
  unknown-subcommand: "<gray>未知的子命令 <white>{arg}</white>. 使用 <white>/{label} help</white> 查看命令."
  target-not-found: "<gray>找不到在线玩家 <white>{player}</white>."

track:
  not-found: "<gray>找不到轨道 <white>{track}</white>."
  already-playing: "<gray>你已经在一条过场轨道中. 使用 <white>/{label} stop</white> 结束."
  no-session: "<gray>当前没有正在播放的轨道."
  play-started: "<gray>正在准备轨道 <white>{track}</white>."
  play-other: "<gray>已为 <white>{player}</white> 准备轨道 <white>{track}</white>."
  play-failed: "<gray>无法开始轨道 <white>{track}</white>: {reason}."
  stop: "<gray>已结束镜头 <white>{track}</white>."
  stop-other: "<gray>已结束 <white>{player}</white> 的镜头 <white>{track}</white>."
  advance: "<gray>信号 <white>{signal}</white> 已送达."
  advance-queued: "<gray>信号 <white>{signal}</white> 已记录，将在对应的等待步骤消费."
  advance-none: "<gray>当前没有等待中的信号."
  start-cancelled: "<gray>轨道启动被其他插件取消."
  world-missing: "<gray>轨道所在世界 <white>{world}</white> 当前未加载."
  list-header: "<gray>共 <white>{count}</white> 条轨道:"
  list-empty: "<gray>还没有任何轨道. 使用 <white>/{label} create <id></white> 创建."
  list-entry: "<dark_gray>· <click:run_command:'/{label} info {id}'><hover:show_text:'<gray>点击查看详情'><white>{id}</white></hover></click> <dark_gray>·</dark_gray> <gray>{name}</gray> <dark_gray>({steps} 步 / {ticks}t)</dark_gray>"
  info-header: "<white>{id}</white> <dark_gray>·</dark_gray> <gray>{name}</gray>"
  info-line: "<dark_gray>·</dark_gray> <gray>{label}: <white>{value}</white>"
  info-preview: "<gray>预览: <click:run_command:'/{label} play {id}'><white>[开始]</white></click> <dark_gray>·</dark_gray> <click:run_command:'/{label} editor {id}'><white>[编辑]</white></click>"
  info-no-steps: "<gray>该轨道还没有步骤."

camera:
  locked: "<gray>过场动画中无法离开镜头."
  timeout: "<gray>等待信号超时，镜头已结束."
  limit: "<gray>轨道超过最大时长，镜头已结束."
  external-teleport: "<gray>检测到外部传送，镜头已结束."
  game-mode: "<gray>检测到游戏模式被外部修改，镜头已结束."
  world-change: "<gray>检测到世界切换，镜头已结束."
  camera-lost: "<red>镜头实体丢失，动画已结束."
  fake-camera-unavailable: "<gray>当前未启用假玩家镜头：<white>blindness</white>/<white>slowness</white>/<white>speed</white> 不会产生画面，FOV 固定为 1.0；<white>darkness</white>/<white>night_vision</white> 仅部分生效. 安装 PacketEvents 后可启用."
  fake-camera-failed: "<gray>假玩家镜头创建失败，已回退到盔甲架镜头；FOV 和失明雾不可用."
  error: "<red>镜头发生错误，动画已结束."
  recovered: "<gray>已恢复上次中断的过场状态."
  recovery-world-missing: "<gray>无法恢复上次过场: 世界 <white>{world}</white> 未加载."
  recovery-failed: "<red>恢复上次过场状态失败，请联系管理员."

reload:
  success: "<gray>已重载 <white>{tracks}</white> 条轨道、配置与消息."
  failure: "<red>重载失败: {reason}"
  editing: "<gray>有管理员正在编辑轨道，暂时无法重载."

manage:
  exists: "<gray>轨道 <white>{track}</white> 已存在."
  deleted: "<gray>已删除轨道 <white>{track}</white>."
  delete-confirm: "<gray>这会删除轨道 <white>{track}</white>. 再次执行 <white>{command}</white> 确认."
  invalid-id: "<gray>轨道 id 只能包含小写字母、数字、<white>-</white> 和 <white>_</white>，最长 64 个字符."
  no-player: "<gray>创建轨道需要玩家视角作为起点，请由玩家执行."
  edit-busy: "<gray>轨道 <white>{track}</white> 正在被其他管理员编辑，请稍后再试."

editor:
  already: "<gray>你已经在编辑轨道 <white>{track}</white>."
  not-editing: "<gray>你当前不在编辑模式. 使用 <white>/camerarail editor</white> 打开图形编辑器."
  opened: "<gray>正在编辑 <white>{track}</white>. 当前世界 <white>{world}</white>."
  created: "<gray>已创建轨道 <white>{track}</white>，起点为你当前视角."
  world-mismatch: "<gray>请先前往轨道所在世界 <white>{world}</white>."
  start-set: "<gray>已将 <white>{track}</white> 的起点设为当前视角."
  exit-set: "<gray>已将 <white>{track}</white> 的退出点设为当前脚下位置."
  exit-mode-set: "<gray>轨道 <white>{track}</white> 退出点已改为 <white>{mode}</white>."
  exit-mode-custom: "<gray>还没有自定义退出点；先执行 <white>/{label} edit {track} exit</white> 取当前脚下位置，或 <white>exit <x> <y> <z></white>."
  need-path: "<gray>该步骤不是路径."
  path-point-added: "<gray>已向 <white>{target}</white> 追加路径点，共 <white>{count}</white> 个."
  path-point-inserted: "<gray>已在 <white>{target}</white> 后插入路径点，共 <white>{count}</white> 个."
  path-point-moved: "<gray>已移动路径点 <white>{target}</white>."
  path-point-removed: "<gray>已删除路径点 <white>{target}</white>，剩余 <white>{count}</white> 个."
  path-created: "<gray>已创建路径步骤 <white>{index}</white>. 用取景工具右键追加路径点，或 <white>/{label} edit {track}:{index} point add</white>."
  saved: "<gray>已保存轨道 <white>{track}</white>."
  save-failed: "<red>保存失败，请查看控制台."
  undone: "<gray>已撤销上一步编辑."
  preview-started: "<gray>正在预览 <white>{track}</white>. 再次执行同一命令停止，或潜行退出."
  preview-stopped: "<gray>预览已停止."
  preview-active: "<gray>正在预览中，请先停止当前预览."
  closed: "<gray>已退出编辑模式."
  usage: "<gray>用法: <white>/{label} editor [<轨道>|close]</white>."
  deleted: "<gray>已删除轨道 <white>{track}</white>."
  display-set: "<gray>轨道 <white>{track}</white> 显示名称已更新为 <white>{name}</white>."
  sway-set: "<gray>轨道 <white>{track}</white> 默认摇摆已设为 <white>{sway}</white>（周期 <white>{period}t</white>）."
  follow-set: "<gray>轨道 <white>{track}</white> 跟随区块加载已设为 <white>{value}</white>."
  step-sway-set: "<gray>步骤 <white>{target}</white> 摇摆已设为 <white>{sway}</white>."
  duration-set: "<gray>步骤 <white>{target}</white> 时长已设为 <white>{ticks}t</white>."
  easing-set: "<gray>步骤 <white>{target}</white> 缓动已设为 <white>{easing}</white>."
  target-usage: "<gray>用法: <white>/{label} edit <轨道[:步骤[:路径点]]> <动作> [参数]</white>. 动作列表见 <white>/{label} help edit</white>."
  edit-failed: "<gray>{reason}"
  no-change: "<gray>没有需要写入的修改."
  actions-hint: "<gray>可用动作: </gray>"
  actions-hint-tail: "<gray> <dark_gray>·</dark_gray> 详情见 <white>{usage}</white></gray>"
  action-usage: "<gray>用法: <white>/{label} edit {target} {syntax}</white>."
  wrong-action-head: "<gray>目标 <white>{target}</white> 没有动作 <white>{action}</white>. <gray>可用动作: </gray>"
  added-hint: "<gray>继续编辑: <click:suggest_command:'/{label} edit {target} '><white>/{label} edit {target}</white></click>；字段见 <white>/{label} help edit {type}</white>."
  track-hint-head: "<gray>步骤与预览: </gray>"
  track-settings-head: "<gray>轨道设置: </gray>"
  display-too-long: "<gray>显示名称最长 64 个字符."
  description-too-long: "<gray>说明最长 512 个字符."
  description-set: "<gray>轨道 <white>{track}</white> 说明已更新为 <white>{description}</white>."
  start-pose-set: "<gray>已将 <white>{track}</white> 的起点设为 <white>{pose}</white>."
  exit-pose-set: "<gray>已将 <white>{track}</white> 的退出点设为 <white>{pose}</white>."
  pose-set: "<gray>已将 <white>{target}</white> 设为 <white>{pose}</white>."
  signal-set: "<gray>步骤 <white>{target}</white> 等待信号已设为 <white>{signal}</white>."
  timeout-set: "<gray>步骤 <white>{target}</white> 等待超时已设为 <white>{ticks}t</white>（0 = 永不）."
  title-text-set: "<gray>步骤 <white>{target}</white> 标题已更新为 <white>{text}</white>."
  subtitle-set: "<gray>步骤 <white>{target}</white> 副标题已更新为 <white>{text}</white>."
  fade-set: "<gray>步骤 <white>{target}</white> 标题时间已设为 <white>{fade_in}</white>t / <white>{stay}</white>t / <white>{fade_out}</white>t."
  effect-step-set: "<gray>步骤 <white>{target}</white> 效果步骤已更新: {summary}"
  entry-list-header: "<gray>入场效果 (<white>{count}</white>):"
  entry-empty: "<gray>没有入场效果."
  entry-list-entry: "<dark_gray>·</dark_gray> <white>{index}</white> <gray>{effect}</gray>"
  entry-added: "<gray>已添加入场效果: {effect}"
  entry-set: "<gray>已将入场效果 <white>{index}</white> 设为: {effect}"
  entry-removed: "<gray>已删除入场效果 <white>{index}</white>."
  entry-missing: "<gray>入场效果 <white>{index}</white> 不存在."
  step-summary-move: "目标 {x}, {y}, {z} · yaw {yaw}° / pitch {pitch}° · {ticks}t · {easing} · 摇摆 {sway}"
  step-summary-path: "{points} 个路径点 · {ticks}t · {easing} · 摇摆 {sway}"
  step-summary-hold: "{ticks}t · 摇摆 {sway}"
  step-summary-wait: "信号 {signal} · 超时 {timeout} · 摇摆 {sway}"
  step-summary-cut: "目标 {x}, {y}, {z} · yaw {yaw}° / pitch {pitch}° · 停留 {ticks}t · 摇摆 {sway}"
  step-summary-effect: "{effect}"
  step-summary-title: "标题 {title} · 副标题 {subtitle} · {fade_in}/{stay}/{fade_out}t"
  appended-step: "<gray>已向 <white>{track}</white> 追加步骤 <white>{index}</white>: {summary}"
  step-status: "<gray><white>{track}:{index}</white> <dark_gray>·</dark_gray> <white>{type}</white> <dark_gray>·</dark_gray> <gray>{summary}</gray>"
  step-missing: "<gray>轨道 <white>{track}</white> 没有步骤 <white>{index}</white>."
  point-missing: "<gray>找不到路径点 <white>{target}</white>."
  path-point-count: "<gray>共 <white>{count}</white> 个路径点."
  point-status: "<gray><white>{target}</white> <dark_gray>·</dark_gray> <white>{x}, {y}, {z}</white> <dark_gray>·</dark_gray> <gray>yaw {yaw}° / pitch {pitch}°</gray>"
  here-updated: "<gray>已用当前视角更新 <white>{target}</white>."
  step-moved: "<gray>已把 <white>{track}:{from}</white> 移到 <white>{track}:{to}</white>."
  step-removed: "<gray>已删除 <white>{track}:{index}</white>. 可用 <white>/{label} edit {track} undo</white> 撤销."
  step-duplicated: "<gray>已复制 <white>{track}:{index}</white> 为 <white>{track}:{copy}</white>."
  invalid-effect: "<gray>未知的药水效果 <white>{effect}</white>. 可以使用 blindness、darkness、nausea、night_vision、slowness、speed 或带命名空间的 id."
  invalid-value: "<gray>无效的值 <white>{value}</white>."
  preview-ended: "<gray>预览结束."

# /camerarail help 与 /camerarail help edit 的文字。
# 排版（缩进、对齐、点击填入）由插件绘制；这里提供文字。summary、标签与页脚支持 MiniMessage，
# detail 为纯文本，会按聊天宽度自动换行。
help:
  title: "<gray>CameraRail</gray> <dark_gray>·</dark_gray> <white>{scope}</white> <dark_gray>·</dark_gray> <gray>{command}</gray>"
  scope:
    root: "镜头轨道"
    editor: "轨道编辑器"
  target-hint: "<gray>目标: <white><轨道></white> · <white><轨道:步骤></white> · <white><轨道:步骤:路径点></white>."
  target-hint-escape: "<gray>编号从 1 开始；Dialog 占用轨道时拒绝修改."
  group:
    track: "轨道"
    playback: "播放"
    editor: "编辑"
    manage: "管理"
    settings: "轨道"
    entry: "入场"
    step: "步骤"
    step-point: "步骤/路径点"
    move: "移动"
    path: "路径"
    hold: "停留"
    wait: "等待"
    cut: "硬切"
    effect: "效果"
    title: "标题"
    point: "路径点"
    preview: "预览"
    save: "保存"
  labels:
    usage: "用法"
    args: "参数"
    detail: "说明"
    permission: "权限"
    related: "相关"
  hover:
    fill: "<dark_gray>点击填入命令</dark_gray>"
  footer:
    root: "<dark_gray>点击命令填入</dark_gray> <dark_gray>·</dark_gray> <gray>/{label} help <命令></gray> <dark_gray>查看详情</dark_gray>"
    editor: "<dark_gray>点击命令填入</dark_gray> <dark_gray>·</dark_gray> <gray>/{label} help edit <动作></gray> <dark_gray>查看详情</dark_gray>"
  not-found: "<gray>没有名为 <white>{command}</white> 的命令. 使用 <white>{usage}</white> 查看全部命令."
  no-commands: "<gray>你没有可用的子命令."
  detail:
    title: "<white>{name}</white> <dark_gray>·</dark_gray> <gray>{summary}</gray>"
    denied: "<gray>你没有使用这个命令的权限."
  commands:
    root:
      list:
        summary: "列出全部轨道"
        detail: "显示轨道 id、步数和总时长，点击条目可以查看详情."
      info:
        summary: "查看轨道详情"
        detail: "显示世界、步骤、总时长、摇摆、区块跟随和等待信号."
        args:
          - "<id> 轨道 id，可以用 /{label} list 查看"
      play:
        summary: "为玩家播放一条轨道"
        detail: "只有一条轨道时可以省略 id；省略玩家时播放给自己."
        args:
          - "<id> 轨道 id"
          - "[玩家] 目标玩家，默认自己"
      stop:
        summary: "结束正在播放的镜头"
        detail: "玩家会回到轨道退出点，没有时回到进入前的位置."
        args:
          - "[玩家] 目标玩家，默认自己"
      advance:
        summary: "发送信号，推进 wait 步骤"
        detail: "* 表示推进当前任意等待；提前到达的信号会排队."
        args:
          - "<信号|*> 信号名，或 * 表示任意信号"
          - "[玩家] 目标玩家，默认自己"
      edit:
        summary: "按目标层级编辑轨道"
        detail: "目标分三层：<轨道> 改轨道设置、入场效果和步骤集合（list/add）；<轨道:步骤> 改该步骤的字段（随步骤类型不同）；<轨道:步骤:路径点> 改单个路径点。不带参数时列出动作，完整说明见 /{label} help edit."
        args:
          - "<目标> 轨道[:步骤[:路径点]]"
          - "<动作> 见 /{label} help edit"
      editor:
        summary: "打开 Dialog 图形编辑器"
        detail: "不带参数打开图形编辑器（轨道列表）；带轨道 id 直接打开该轨道的编辑会话；editor close 关闭当前编辑会话并释放轨道."
        args:
          - "[<轨道>] 轨道 id，省略则打开轨道列表"
          - "close 关闭编辑会话"
      tools:
        summary: "打开编辑工具箱子"
        detail: "领取取景工具与预览工具，也可以从 Dialog 编辑器的「编辑工具」按钮进入."
      create:
        summary: "以当前视角创建一条轨道"
        detail: "起点取当前眼睛位置；创建后不占用 Dialog 编辑会话，可直接用 edit 命令或编辑器继续调整."
        args:
          - "<id> 轨道 id，只含小写字母、数字、- 和 _"
          - "[名称] 显示名称，可以包含空格"
      delete:
        summary: "删除一条轨道"
        detail: "需要二次确认；正在被编辑的轨道不能删除."
        args:
          - "<id> 轨道 id"
          - "confirm 确认删除"
      reload:
        summary: "重载轨道、配置与消息"
        detail: "有管理员正在编辑轨道时不会重载，避免覆盖未保存的修改."
    editor:
      display:
        summary: "设置轨道显示名称"
        detail: "显示名称用于列表和提示，可以与 id 不同."
        args:
          - "<名称> 可以包含空格"
      description:
        summary: "设置轨道说明"
        detail: "说明会显示在轨道信息里；留空表示清除."
        args:
          - "[说明] 可以包含空格"
      start:
        summary: "设置轨道起点"
        detail: "不带参数时取当前视角；带坐标时写入眼睛位置，yaw/pitch 省略时保留当前朝向."
        args:
          - "[x y z [yaw pitch]] 省略则取当前视角"
      exit:
        summary: "设置自定义退出点"
        detail: "不带参数时取当前脚下位置；设置后退出模式自动切到 custom."
        args:
          - "[x y z [yaw pitch]] 省略则取当前脚下位置"
      exit-mode:
        summary: "设置退出点模式"
        detail: "animation-end 停在镜头最后位置（默认），pre-entry 回到进入前位置，custom 使用 exit 设置的位置."
        args:
          - "<模式> animation-end、pre-entry 或 custom"
      sway:
        summary: "设置轨道默认摇摆"
        detail: "步骤的 sway 继承这个设置；周期省略时保留当前值."
        args:
          - "<预设> off、gentle、natural 或 strong"
          - "[周期] 摇摆周期（tick）"
      follow:
        summary: "设置是否跟随区块加载"
        detail: "开启后玩家随镜头移动，附近区块持续加载."
        args:
          - "<true|false> 开启或关闭"
      entry:
        summary: "管理入场效果"
        detail: "入场效果只在镜头从起点开始时施加；set/remove 使用 entry list 里的序号."
        args:
          - "list 列出入场效果"
          - "add <效果> [等级] [时长] 追加"
          - "set <序号> <效果> [等级] [时长] 修改"
          - "remove <序号> 删除"
      list:
        summary: "列出轨道的步骤"
        detail: "每行附带可点击的步骤命令，先看再改."
      add:
        summary: "追加一个步骤"
        detail: "按类型追加到轨道末尾；省略参数时取与 Dialog 相同的默认值，再用步骤层字段（duration/easing/sway 等）修改，顺序用 up/down 调整."
        args:
          - "<类型> move、path、hold、wait、cut、effect 或 title"
          - "move [时长] 以当前视角追加移动步骤"
          - "path [时长] 追加路径步骤，首个路径点取当前视角"
          - "hold [时长] 追加停留步骤"
          - "wait [信号] [超时] 省略信号时自动生成该轨道未占用的名字：wait、wait2、wait3…"
          - "cut [停留] 追加快切步骤，0 表示瞬时"
          - "effect [add|remove] [效果] [等级] [时长] 省略动作视为 add，省略效果时为 darkness"
          - "title [淡入 停留 淡出] <标题>[|<副标题>] 三数字形式，自定义淡入/停留/淡出"
          - "title <标题>[|<副标题>] 便捷形式，淡入/停留/淡出取 20 60 20"
      remove:
        summary: "删除步骤或路径点"
        detail: "删除步骤时可用轨道 undo 撤销；删除路径点时至少保留一个点."
      duplicate:
        summary: "复制步骤"
        detail: "把这一步复制到它后面."
      up:
        summary: "上移一步"
        detail: "与上一步交换位置."
      down:
        summary: "下移一步"
        detail: "与下一步交换位置."
      move:
        summary: "移动步骤的字段"
        detail: "here 取当前视角作为目标；pos 直接写坐标；duration/easing/sway 修改时间与镜头晃动."
        args:
          - "here 目标设为当前视角"
          - "pos <x> <y> <z> [yaw] [pitch] 显式目标"
          - "duration <tick> 时长"
          - "easing <曲线> 缓动"
          - "sway <预设> 步骤摇摆"
      path:
        summary: "路径步骤的字段"
        detail: "路径点用 point 管理；duration/easing/sway 控制整段路径."
        args:
          - "duration <tick> 时长"
          - "easing <曲线> 缓动"
          - "sway <预设> 步骤摇摆"
          - "point <list|add> 列出或追加路径点"
      hold:
        summary: "停留步骤的字段"
        args:
          - "duration <tick> 时长"
          - "sway <预设> 步骤摇摆"
      wait:
        summary: "等待步骤的字段"
        args:
          - "signal <信号> 等待的信号"
          - "timeout <tick> 超时，0 表示永不"
          - "sway <预设> 步骤摇摆"
      cut:
        summary: "硬切步骤的字段"
        detail: "here/pos 设置切到的位置；duration 是切后的停留时间."
        args:
          - "here 目标设为当前视角"
          - "pos <x> <y> <z> [yaw] [pitch] 显式目标"
          - "duration <tick> 停留时间"
          - "sway <预设> 步骤摇摆"
      effect:
        summary: "效果步骤的字段"
        detail: "action 为 add 时等级/时长生效；remove 只需要效果 id."
        args:
          - "<add|remove> 施加或移除"
          - "<效果> 效果 id"
          - "[等级] 0 = I 级"
          - "[时长] tick，0 = 持续"
      title:
        summary: "标题步骤的字段"
        detail: "title/subtitle 支持 MiniMessage，省略文本表示清除；fade 依次设置淡入、停留、淡出."
        args:
          - "title [文本] 主标题，留空清除"
          - "subtitle [文本] 副标题，留空清除"
          - "fade <淡入> <停留> <淡出> 时间（tick）"
      duration:
        summary: "修改步骤时长"
        detail: "适用于 move/path/hold/cut 步骤（wait 用 timeout）；单位 tick，20 tick = 1 秒."
        args:
          - "<tick> 时长"
      easing:
        summary: "修改步骤缓动"
        detail: "适用于 move/path 步骤；值同 Easing."
        args:
          - "<曲线> linear、ease-in、ease-out、ease-in-out、smoothstep、smootherstep 或 sine"
      signal:
        summary: "修改等待信号"
        detail: "wait 步骤等待的信号名；同一轨道内不能重复，可用 /{label} advance <信号> 发送."
        args:
          - "<信号> 信号名"
      timeout:
        summary: "修改等待超时"
        detail: "wait 步骤的超时；0 表示永不超时."
        args:
          - "<tick> 超时（tick），0 = 永不"
      subtitle:
        summary: "修改标题步骤的副标题"
        detail: "支持 MiniMessage；省略文本表示清除."
        args:
          - "[文本] 副标题，留空清除"
      fade:
        summary: "修改标题步骤的时间"
        detail: "依次设置淡入、停留、淡出（tick）."
        args:
          - "<淡入> <停留> <淡出> 时间（tick）"
      point:
        summary: "路径步骤的路径点"
        detail: "追加路径点会取当前视角；具体点的修改用 <轨道:步骤:路径点>."
        args:
          - "list 列出路径点"
          - "add 追加当前视角"
      here:
        summary: "取当前视角"
        detail: "move/cut 步骤写目标姿态，路径点写该点坐标."
      pos:
        summary: "显式设置姿态"
        detail: "move/cut 步骤写目标姿态，路径点写该点坐标；yaw/pitch 省略时保留原朝向."
        args:
          - "<x> <y> <z> 坐标"
          - "[yaw] [pitch] 朝向角度"
      insert:
        summary: "在路径点后插入当前视角"
        detail: "先用当前视角插入一个新路径点，再修改它."
      preview:
        summary: "从目标开始预览"
        detail: "轨道目标从起点播放，步骤目标从该步骤开始；再次执行同一命令即停止，也可用 stop 或潜行退出."
      stop:
        summary: "停止预览"
        detail: "停止 preview 启动的预览；轨道、步骤、路径点目标都接受 stop."
      undo:
        summary: "撤销该轨道最近一次修改"
        detail: "每个玩家最多保留 30 次修改，只对命令/工具编辑生效."
      save:
        summary: "立即保存轨道"
        detail: "修改本来就会自动保存，这个命令用于强制写入."
