# ZthCameraRail 游戏内消息（MiniMessage）
# 支持 <white>、<gray>、<gradient:...> 等 Adventure 标签。
prefix: "<dark_gray>[<gray>镜头<dark_gray>]<reset> "

command:
  player-only: "<gray>此操作需要由玩家执行."
  no-permission: "<gray>你没有权限使用这个功能."
  usage: "<gray>用法: <white>{usage}</white>."
  unknown-subcommand: "<gray>未知的子命令 <white>{arg}</white>. 使用 <white>/zth-camera help</white>."
  target-not-found: "<gray>找不到在线玩家 <white>{player}</white>."

track:
  not-found: "<gray>找不到轨道 <white>{track}</white>."
  already-playing: "<gray>你已经在一条过场轨道中. 使用 <white>/zth-camera stop</white> 结束."
  no-session: "<gray>当前没有正在播放的轨道."
  play-started: "<gray>正在准备轨道 <white>{track}</white>."
  play-other: "<gray>已为 <white>{player}</white> 准备轨道 <white>{track}</white>."
  play-failed: "<gray>无法开始轨道 <white>{track}</white>: {reason}."
  stop: "<gray>已结束镜头 <white>{track}</white>."
  stop-other: "<gray>已结束 <white>{player}</white> 的镜头 <white>{track}</white>."
  advance: "<gray>信号 <white>{signal}</white> 已送达."
  advance-queued: "<gray>信号 <white>{signal}</white> 已记录，将在对应的等待步骤消费."
  advance-none: "<gray>当前没有等待中的信号."
  advance-no-match: "<gray>当前等待的信号不是 <white>{signal}</white>."
  start-cancelled: "<gray>轨道启动被其他插件取消."
  world-missing: "<gray>轨道所在世界 <white>{world}</white> 当前未加载."
  finished: "<gray>镜头 <white>{track}</white> 已结束."
  list-header: "<gray>共 <white>{count}</white> 条轨道:"
  list-empty: "<gray>还没有任何轨道. 使用 <white>/zth-camera edit create [id]</white> 创建."
  list-entry: "<dark_gray>· <click:run_command:'/zth-camera info {id}'><hover:show_text:'<gray>点击查看详情'><white>{id}</white></hover></click> <dark_gray>·</dark_gray> <gray>{name}</gray> <dark_gray>({steps} 步 / {ticks}t)</dark_gray>"
  info-header: "<white>{id}</white> <dark_gray>·</dark_gray> <gray>{name}</gray>"
  info-line: "<dark_gray>·</dark_gray> <gray>{label}: <white>{value}</white>"
  info-preview: "<gray>预览: <click:run_command:'/zth-camera play {id}'><white>[开始]</white></click> <dark_gray>·</dark_gray> <click:run_command:'/zth-camera edit open {id}'><white>[编辑]</white></click>"
  info-no-steps: "<gray>该轨道还没有步骤."

camera:
  locked: "<gray>过场动画中无法离开镜头."
  timeout: "<gray>等待信号超时，镜头已结束."
  limit: "<gray>轨道超过最大时长，镜头已结束."
  external-teleport: "<gray>检测到外部传送，镜头已结束."
  game-mode: "<gray>检测到游戏模式被外部修改，镜头已结束."
  world-change: "<gray>检测到世界切换，镜头已结束."
  camera-lost: "<red>镜头实体丢失，动画已结束."
  error: "<red>镜头发生错误，动画已结束."
  ended: "<gray>镜头结束: {reason}."
  recovered: "<gray>已恢复上次中断的过场状态."
  recovery-world-missing: "<gray>无法恢复上次过场: 世界 <white>{world}</white> 未加载."
  recovery-failed: "<red>恢复上次过场状态失败，请联系管理员."

reload:
  success: "<gray>已重载 <white>{tracks}</white> 条轨道、配置与消息."
  failure: "<red>重载失败: {reason}"
  editing: "<gray>有管理员正在编辑轨道，暂时无法重载."

manage:
  exists: "<gray>轨道 <white>{track}</white> 已存在."
  created: "<gray>已创建轨道 <white>{track}</white>."
  deleted: "<gray>已删除轨道 <white>{track}</white>."
  delete-confirm: "<gray>这会删除轨道 <white>{track}</white>. 再次执行 <white>{command}</white> 确认."
  invalid-id: "<gray>轨道 id 只能包含小写字母、数字、<white>-</white> 和 <white>_</white>，最长 64 个字符."
  no-player: "<gray>创建轨道需要玩家视角作为起点，请由玩家执行."
  edit-busy: "<gray>轨道 <white>{track}</white> 正在被其他管理员编辑，请稍后再试."
  delete-busy: "<gray>有管理员正在编辑轨道，请先退出编辑模式再删除."

editor:
  already: "<gray>你已经在编辑轨道 <white>{track}</white>."
  not-editing: "<gray>你当前不在编辑模式. 使用 <white>/zth-camera edit open [id]</white>."
  opened: "<gray>正在编辑 <white>{track}</white>. 当前世界 <white>{world}</white>."
  created: "<gray>已创建轨道 <white>{track}</white>，起点为你当前视角."
  world-mismatch: "<gray>请先前往轨道所在世界 <white>{world}</white>."
  status: "<gray>编辑 <white>{track}</white> <dark_gray>·</dark_gray> <gray>选中 {selected}</gray> <dark_gray>·</dark_gray> <gray>{count} 步</gray> <dark_gray>·</dark_gray> <gray>{duration}t</gray> <dark_gray>·</dark_gray> {state}"
  state-saved: "<gray>已保存"
  state-dirty: "<gray>保存中"
  selected: "<gray>已选中步骤 <white>{index}</white>: {summary}"
  start-set: "<gray>起点已更新为当前位置."
  exit-set: "<gray>退出点已更新为当前脚下位置."
  added: "<gray>已追加步骤 <white>{index}</white>: {summary}"
  updated: "<gray>已更新步骤 <white>{index}</white>: {summary}"
  removed: "<gray>已删除步骤 <white>{index}</white>."
  moved: "<gray>已移动步骤 <white>{index}</white>."
  selected-index-invalid: "<gray>步骤编号必须在 <white>1</white> 到 <white>{max}</white> 之间."
  no-step: "<gray>请先选择一个步骤."
  not-camera-step: "<gray>该操作只适用于移动/路径/停留/等待步骤."
  need-duration: "<gray>该步骤需要时长."
  need-path: "<gray>该步骤不是路径."
  path-point-added: "<gray>已向路径追加一个路径点，共 <white>{count}</white> 个."
  path-point-removed: "<gray>已删除路径最后一个点，剩余 <white>{count}</white> 个."
  path-point-min: "<gray>路径至少需要保留一个点."
  path-created: "<gray>已创建路径步骤，请继续用 <white>/zth-camera edit point</white> 添加路径点."
  path-needs-points: "<gray>路径步骤至少需要两个路径点才能预览."
  saved: "<gray>已保存轨道 <white>{track}</white>."
  save-failed: "<red>保存失败，请查看控制台."
  nothing-to-undo: "<gray>没有可以撤销的操作."
  undone: "<gray>已撤销上一步编辑."
  preview-started: "<gray>正在预览 <white>{track}</white>. 再次执行停止."
  preview-stopped: "<gray>预览已停止."
  preview-no-steps: "<gray>轨道还没有镜头步骤，无法预览."
  preview-active: "<gray>正在预览中，请先停止当前预览."
  closed: "<gray>已退出编辑模式."
  deleted: "<gray>已删除轨道 <white>{track}</white>."
  delete-confirm: "<gray>再次执行 <white>{command}</white> 以删除轨道 <white>{track}</white>."
  display-set: "<gray>显示名称已更新为 <white>{name}</white>."
  sway-set: "<gray>轨道默认摇摆已设为 <white>{sway}</white>."
  follow-set: "<gray>跟随区块加载已设为 <white>{value}</white>."
  step-sway-set: "<gray>步骤摇摆已设为 <white>{sway}</white>."
  duration-set: "<gray>步骤时长已设为 <white>{ticks}t</white>."
  easing-set: "<gray>缓动已设为 <white>{easing}</white>."
  title-set: "<gray>标题步骤已更新."
  effect-added: "<gray>已追加效果步骤: {summary}"
  wait-added: "<gray>已追加等待步骤: <white>{signal}</white>."
  hold-added: "<gray>已追加停留步骤: <white>{ticks}t</white>."
  cut-added: "<gray>已追加快切步骤."
  path-added: "<gray>已追加路径步骤."
  display-usage: "<gray>用法: <white>/zth-camera edit display [名称]</white>."
  effect-usage: "<gray>用法: <white>/zth-camera edit effect [add|remove] [效果] [等级] [时长]</white>."
  title-usage: "<gray>用法: <white>/zth-camera edit title [fade-in] [stay] [fade-out] [标题]|[副标题]</white>."
  wait-usage: "<gray>用法: <white>/zth-camera edit wait [信号] [超时t]</white>."
  select-usage: "<gray>用法: <white>/zth-camera edit select [步骤编号]</white>."
  no-permission: "<gray>你没有权限编辑轨道."
  duplicate-signal: "<gray>等待信号 <white>{signal}</white> 已存在."
  invalid-effect: "<gray>未知的药水效果 <white>{effect}</white>. 可以使用 blindness、darkness、slowness 或带命名空间的 id."
  invalid-title: "<gray>标题文本不是合法的 MiniMessage."
  invalid-value: "<gray>无效的值 <white>{value}</white>."
  limit: "<gray>已达到限制: <white>{limit}</white>."
  preview-other: "<gray>正在播放其他镜头，无法开始预览."
  preview-ended: "<gray>预览结束."
  preview-failed: "<gray>预览启动失败."
  help:
    - "<gray>编辑命令:"
    - "<dark_gray>·</dark_gray> <white>/zth-camera edit start|exit</white> <gray>更新起点/退出点</gray>"
    - "<dark_gray>·</dark_gray> <white>/zth-camera edit add [时长]</white> <gray>从当前视角追加移动</gray>"
    - "<dark_gray>·</dark_gray> <white>/zth-camera edit path</white> <gray>追加路径步骤</gray>"
    - "<dark_gray>·</dark_gray> <white>/zth-camera edit point</white> <gray>给路径追加当前视角</gray>"
    - "<dark_gray>·</dark_gray> <white>/zth-camera edit hold [时长]</white>"
    - "<dark_gray>·</dark_gray> <white>/zth-camera edit wait [信号] [超时]</white>"
    - "<dark_gray>·</dark_gray> <white>/zth-camera edit effect add|remove [效果] [等级] [时长]</white>"
    - "<dark_gray>·</dark_gray> <white>/zth-camera edit title [fade] [stay] [fadeout] [标题]|[副标题]</white>"
    - "<dark_gray>·</dark_gray> <white>/zth-camera edit select [编号]|duration [t]|easing [曲线]|sway [预设]</white>"
    - "<dark_gray>·</dark_gray> <white>/zth-camera edit up|down|remove|undo</white>"
    - "<dark_gray>·</dark_gray> <white>/zth-camera edit preview|stop|save|done|close</white>"
