# ZthCameraRail - 摄像机轨道示例
# 时间单位为 tick，20 tick = 1 秒。
# 一条轨道只能在一个世界内移动；所有坐标都是该世界的绝对坐标。
# 完整的字段说明见 docs/yaml-reference.md。
#
# 运行 /zth-camera reload 后，可以用 /zth-camera play login 预览。
# 如果 world 名称与你的服务器不同，请改掉它，或直接用 /zth-camera edit create login。

schema-version: 1

tracks:
  # 示例：登录过场。玩家在暗处等待外部信号，登录完成后镜头穿过三个路径点。
  # 结束位置默认是动画最后的位置；需要安全落点时写 exit-mode: pre-entry，
  # 或用 exit-mode: custom + exit（玩家脚部位置）指定固定落点。
  # 这里的坐标只是示例；请用 /zth-camera edit create 在你自己的场景里重新录制。
  login:
    display-name: "登录 · 晨雾"
    description: "登录期间的镜头过场示例。"
    world: world
    start:
      x: 0.5
      y: 100.0
      z: 0.5
      yaw: 0.0
      pitch: 10.0
    # 默认摇摆预设：off / gentle / natural / strong
    sway: natural
    # 玩家实体是否跟随镜头区块加载
    follow: true
    # 进入镜头前施加的效果，用来压暗第一次硬切；之后在步骤中移除。
    # 安装 PacketEvents 并启用假玩家镜头后，blindness/darkness/night_vision 的雾、
    # 以及 slowness/speed 的 FOV 都会生效；未安装时只有 darkness/nausea/night_vision
    # 等少数效果有画面。见 docs/spectator-effects.md。
    entry-effects:
      - effect: darkness
    steps:
      # 先保持黑暗，让登录提示有机会显示
      - type: hold
        duration: 40
        sway: off
      # 黑暗效果被移除的瞬间，画面会亮起
      - type: effect
        effect: darkness
        action: remove
      # 缓慢推近风景
      - type: move
        to:
          x: 8.5
          y: 98.0
          z: -6.5
          yaw: 28.0
          pitch: 6.0
        duration: 100
        easing: ease-in-out
        sway: natural
      - type: title
        title: "<gray>欢迎回到 <white>Zeroth</white></gray>"
        subtitle: "<dark_gray>正在同步你的位置</dark_gray>"
        fade-in: 20
        stay: 60
        fade-out: 20
      # 等待 AuthMe 或胶水插件通知登录完成
      - type: wait
        signal: authme:authenticated
        timeout: 6000
        sway: gentle
      # 平滑穿过三个路径点，最终到达出生点上方
      - type: path
        duration: 120
        easing: ease-in-out
        points:
          - x: 2.5
            y: 98.5
            z: 4.5
            yaw: 10.0
            pitch: 3.0
          - x: 0.5
            y: 99.5
            z: 2.5
            yaw: 0.0
            pitch: 0.0
          - x: 0.5
            y: 100.0
            z: 0.5
            yaw: 0.0
            pitch: 0.0
      # 最后停留一拍，避免立刻交还控制权时显得突兀
      - type: hold
        duration: 10
        sway: gentle
