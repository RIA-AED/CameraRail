name: CameraRail
version: 1.2.0
main: red.ria.camerarail.CameraRailPlugin
api-version: '26.1.2'
folia-supported: true
load: POSTWORLD
softdepend: [packetevents]
description: 轻量的旁观者镜头轨道与过场动画，支持 Paper/Folia。
authors: [RIA]
commands:
  camerarail:
    description: 管理镜头轨道、预览与游戏内编辑。
    usage: /camerarail help
    aliases: [camera-rail]
    permission: camerarail.command
permissions:
  camerarail.command:
    description: 使用镜头轨道命令（只负责进入命令；具体操作还需对应子权限）。
    default: op
  camerarail.play:
    description: 播放镜头轨道。
    default: op
  camerarail.stop:
    description: 结束镜头轨道。
    default: op
  camerarail.advance:
    description: 发送等待信号。
    default: op
  camerarail.edit:
    description: 使用游戏内编辑器与编辑工具（获取及使用）。
    default: op
  camerarail.manage:
    description: 创建和删除轨道（同时需要 camerarail.edit）。
    default: op
  camerarail.reload:
    description: 重载配置与轨道。
    default: op
